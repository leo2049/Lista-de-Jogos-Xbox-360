<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de Jogos Xbox 360</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, #0f2027, #203a43, #2c5364);
    color: white;
    text-align: center;
}

/* CONTADOR FLUTUANTE */
#contadorFlutuante {
    position: fixed;
    bottom: 12px;
    right: 12px;
    background: rgba(0, 0, 0, 0.75);
    color: #00ff00;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: bold;
    z-index: 9999;
}

/* INTRO */
#intro {
    position: fixed;
    inset: 0;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

#intro video {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* TÍTULO */
h1 {
    background: radial-gradient(circle at right, #107c10 0%, #0f2027 80%);
    padding: 20px;
    margin: 0;
    font-size: 1.8rem;
}

/* CATEGORIAS */
.categoria h2 {
    background: radial-gradient(circle at right, #107c10 0%, #0f2027 80%);
    padding: 12px;
    margin: 30px 0 15px 0;
    font-size: 1.3rem;
}

/* CONTAINER */
.container {
    padding: 10px;
}

input {
    padding: 12px;
    margin: 5px;
    width: 95%;
    max-width: 400px;
    border-radius: 6px;
    border: none;
    font-size: 1rem;
}

#contadorTexto {
    margin: 15px;
    font-weight: bold;
    color: #00ff88;
}

/* LISTA DE CAPAS */
.games {
    display: grid;
    grid-template-columns: repeat(6, minmax(130px, 1fr));
    gap: 16px;
    padding: 8px 3%;
    align-items: start;
}

/* CARD DO JOGO */
.game {
    position: relative;
    background: #121212;
    border: 2px solid transparent;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
    padding: 0;
    min-width: 0;
    box-shadow: 0 4px 12px rgba(0,0,0,.28);
}

.game:hover {
    transform: translateY(-4px);
    border-color: #00ff88;
    box-shadow: 0 7px 18px rgba(0,255,136,.18);
}

.game img {
    display: block;
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    background: #222;
}

.game .nome-jogo {
    min-height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 7px 6px;
    box-sizing: border-box;
    font-size: .82rem;
    line-height: 1.15;
    font-weight: bold;
    background: #1e1e1e;
}

.game .marcador {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 30px;
    height: 30px;
    display: none;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #ff3333;
    color: white;
    font-size: 18px;
    font-weight: bold;
    box-shadow: 0 2px 7px rgba(0,0,0,.5);
}

/* SELECIONADO */
.game.selected {
    border-color: #ff4d4d;
    box-shadow: 0 0 0 2px rgba(255,77,77,.25), 0 8px 20px rgba(255,0,0,.22);
}

.game.selected .nome-jogo {
    background: linear-gradient(135deg, #7a0000, #b30000);
}

.game.selected .marcador {
    display: flex;
}

/* RESPONSIVO */
@media (max-width: 1200px) {
    .games {
        grid-template-columns: repeat(5, minmax(125px, 1fr));
    }
}

@media (max-width: 900px) {
    .games {
        grid-template-columns: repeat(4, minmax(110px, 1fr));
        gap: 12px;
        padding: 6px 2%;
    }
}

@media (max-width: 650px) {
    .games {
        grid-template-columns: repeat(3, minmax(95px, 1fr));
        gap: 9px;
    }

    .game .nome-jogo {
        font-size: .72rem;
        min-height: 38px;
    }

    .game .marcador {
        width: 25px;
        height: 25px;
        top: 5px;
        right: 5px;
        font-size: 15px;
    }
}

@media (max-width: 400px) {
    .games {
        grid-template-columns: repeat(2, minmax(110px, 1fr));
    }
}

button {
    background-color: transparent;
    color: #00ff88;
    padding: 14px 30px;
    border: 2px solid #00ff88;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    font-size: 1rem;
    margin-top: 15px;
}
</style>

/*
=========================================================
CAPAS MANUAIS DOS JOGOS
=========================================================
Aqui você pode colocar a capa correta de qualquer jogo.

RECOMENDADO:
1. Crie uma pasta chamada "capas" no seu GitHub, no mesmo lugar
   deste index.html.
2. Coloque a imagem dentro dela.
3. Adicione uma linha neste formato:

"Nome exato do jogo": "capas/nome-da-imagem.jpg",

Exemplo:
"Alan Wake": "capas/alan-wake.jpg",

Você também pode usar uma URL direta:
"Alan Wake": "https://site.com/alan-wake.jpg",

As capas colocadas aqui SEMPRE têm prioridade sobre a busca automática.
=========================================================
*/
const capasManuais = {
    // EXEMPLOS — troque pelos seus arquivos:
    // "007 Quantum of Solace": "capas/007-quantum-of-solace.jpg",
    // "Alan Wake": "capas/alan-wake.jpg",
    // "Assassin's Creed": "capas/assassins-creed.jpg",
    // "Grand Theft Auto V": "capas/gta-v.jpg"
};

// Cache das capas encontradas automaticamente.
/* CAPAS DOS JOGOS
   Busca a capa correta na base x360db.
   A base informa que cada jogo possui um Title ID e que o boxart pode
   ser carregado em /titles/{TitleID}/artwork/boxart.jpg.
*/
const capasLocais = {
    // Se algum jogo não for encontrado automaticamente, você pode colocar aqui:
    // "Nome do Jogo": "capas/nome-da-capa.jpg"
};

let bancoCapasXbox360 = [];

function normalizarNome(nome) {
    return nome
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/&/g, "and")
        .replace(/[’']/g, "")
        .replace(/[^a-z0-9]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();
}

function criarCapaFallback(jogo) {
    const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="400" height="600">
            <rect width="100%" height="100%" fill="#202020"/>
            <rect width="100%" height="55" fill="#107c10"/>
            <text x="50%" y="38" text-anchor="middle" font-family="Arial"
                  font-size="22" fill="white">XBOX 360</text>
            <text x="50%" y="48%" text-anchor="middle" font-family="Arial"
                  font-size="22" font-weight="bold" fill="white">SEM CAPA</text>
            <text x="50%" y="54%" text-anchor="middle" font-family="Arial"
                  font-size="15" fill="#00ff88">adicione em /capas</text>
        </svg>`;
    return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
}

function nomeArquivoManual(jogo) {
    return "capas/" + normalizarNome(jogo).replace(/ /g, "-") + ".jpg";
}

function procurarNoBanco(jogo) {
    const alvo = normalizarNome(jogo);

    let encontrado = bancoCapasXbox360.find(g =>
        g && g.title && normalizarNome(g.title) === alvo
    );

    if (!encontrado) {
        const simplificado = alvo
            .replace(/\bgoty\b/g, "")
            .replace(/\bgame of the year edition\b/g, "")
            .replace(/\bcomplete edition\b/g, "")
            .replace(/\bultimate edition\b/g, "")
            .replace(/\bdisc [12]\b/g, "")
            .replace(/\s+/g, " ")
            .trim();

        encontrado = bancoCapasXbox360.find(g => {
            if (!g || !g.title) return false;
            const t = normalizarNome(g.title);
            return t === simplificado ||
                   t.startsWith(simplificado) ||
                   simplificado.startsWith(t);
        });
    }

    return encontrado || null;
}

function carregarCapa(jogo, img) {
    const manual = capasLocais[jogo];

    // Manual tem prioridade.
    if (manual) {
        img.onerror = () => {
            img.onerror = null;
            img.src = nomeArquivoManual(jogo);
        };
        img.src = manual;
        return;
    }

    const game = procurarNoBanco(jogo);

    if (game && game.id) {
        // Não usa a URL boxart do JSON, pois alguns registros antigos
        // podem apontar para URLs que não carregam corretamente no GitHub Pages.
        const urls = [
            `https://xenia-manager.github.io/x360db/titles/${game.id}/artwork/boxart.jpg`,
            `https://raw.githubusercontent.com/xenia-manager/x360db/main/titles/${game.id}/artwork/boxart.jpg`,
            nomeArquivoManual(jogo)
        ];

        let tentativa = 0;
        img.onerror = function() {
            tentativa++;
            if (tentativa < urls.length) {
                img.src = urls[tentativa];
            } else {
                img.onerror = null;
                img.src = criarCapaFallback(jogo);
            }
        };
        img.src = urls[0];
    } else {
        img.onerror = function() {
            img.onerror = null;
            img.src = criarCapaFallback(jogo);
        };
        img.src = nomeArquivoManual(jogo);
    }
}

async function carregarBancoDeCapas() {
    try {
        // URL oficial documentada pela própria x360db.
        const resposta = await fetch(
            "https://xenia-manager.github.io/x360db/games.json",
            { cache: "no-store" }
        );

        if (!resposta.ok) throw new Error("games.json retornou " + resposta.status);

        bancoCapasXbox360 = await resposta.json();

        document.querySelectorAll(".game").forEach(div => {
            const jogo = div.dataset.jogo;
            const img = div.querySelector("img");
            if (jogo && img) carregarCapa(jogo, img);
        });
    } catch (erro) {
        console.warn("Não foi possível carregar a base x360db:", erro);

        // Mesmo sem a base, tenta as capas manuais.
        document.querySelectorAll(".game").forEach(div => {
            const jogo = div.dataset.jogo;
            const img = div.querySelector("img");
            if (jogo && img) carregarCapa(jogo, img);
        });
    }
}


for (let categoria in categorias) {

    const bloco = document.createElement("div");
    bloco.className = "categoria";

    const titulo = document.createElement("h2");
    titulo.innerText = categoria;
    bloco.appendChild(titulo);

    const linha = document.createElement("div");
    linha.className = "games";

    categorias[categoria].sort().forEach(jogo => {

        const div = document.createElement("div");
        div.className = "game";
        div.dataset.jogo = jogo;
        div.title = "Clique para selecionar";

        const img = document.createElement("img");
        img.alt = "Capa de " + jogo;
        img.loading = "lazy";
        img.src = criarCapaFallback(jogo);
        img.onerror = function() {
            // Se uma capa manual estiver com nome/caminho errado, mostra o placeholder.
            this.onerror = null;
            this.src = criarCapaFallback(jogo);
        };

        const nome = document.createElement("div");
        nome.className = "nome-jogo";
        nome.innerText = jogo;

        const marcador = document.createElement("div");
        marcador.className = "marcador";
        marcador.innerText = "✓";

        div.appendChild(img);
        div.appendChild(nome);
        div.appendChild(marcador);

        div.onclick = function() {
            div.classList.toggle("selected");
            atualizarContador();
        };

        linha.appendChild(div);

        // Busca a capa sem travar a montagem da página.
        carregarCapa(jogo, img);
    });

    bloco.appendChild(linha);
    container.appendChild(bloco);
}

// Carrega a base de capas depois que todos os jogos já estão na página.
carregarBancoDeCapas();

/* CONTADOR */
function atualizarContador() {
    const selecionados = document.querySelectorAll(".selected");
    document.getElementById("contadorNumero").textContent = selecionados.length;
    document.getElementById("contadorInterno").textContent = selecionados.length;
}

/* COPIAR */
function copiarTexto() {

    const cliente = document.getElementById("cliente").value || "(não preenchido)";
    const whatsapp = document.getElementById("whatsapp").value || "";
    const selecionados = document.querySelectorAll(".selected");

    if(selecionados.length === 0){
        alert("Selecione pelo menos um jogo.");
        return;
    }

    let jogos = [];

    selecionados.forEach(jogo => {
        jogos.push(jogo.dataset.jogo);
    });

    // ORDENA ALFABETICAMENTE
    jogos.sort((a, b) => a.localeCompare(b));

    let texto = "Cliente: " + cliente + "\n";
    texto += "WhatsApp: " + whatsapp + "\n\n";
    texto += "Jogos escolhidos:\n";

    jogos.forEach(jogo => {
        texto += "- " + jogo + "\n";
    });

    const mensagem = encodeURIComponent(texto);

   let link = "https://wa.me/?text=" + mensagem;

   window.open(link, "_blank");
}

</script>
